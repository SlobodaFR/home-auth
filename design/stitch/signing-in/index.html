<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .spinner-container {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .spinner-track {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #e5e7eb; /* hairline color equivalent */
        }

        .spinner-active {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #3525cd; /* primary indigo */
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shimmer-text {
            background: linear-gradient(90deg, #111111 0%, #6b7280 50%, #111111 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 2.5s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }
    </style>

                        "error": "#ef4444",

                        "outline": "#777587",
                        "surface-tint": "#4d44e3",

<body class="bg-canvas text-ink antialiased">
<!-- Transition Canvas -->
<main class="flex flex-col items-center justify-center min-h-screen p-margin-desktop overflow-hidden">
<!-- Center Transition Content -->
<div class="flex flex-col items-center gap-lg max-w-sm w-full fade-in">
<!-- Logo / Brand Anchor (Auth Service) -->
<div class="mb-xl">
<span class="text-headline-lg font-headline-lg font-black text-primary tracking-tighter">
                    Auth Service
                </span>
</div>
<!-- Loader Wrapper -->
<div class="relative flex items-center justify-center">
<!-- Background Atmospheric Glow -->
<div class="absolute w-24 h-24 bg-primary/10 rounded-full blur-2xl"></div>
<!-- Spinner -->
<div class="spinner-container">
<div class="spinner-track border-hairline"></div>
<div class="spinner-active border-t-primary"></div>
</div>
</div>
<!-- Status Text -->
<div class="text-center mt-md">
<h1 class="font-headline-md text-headline-md text-ink shimmer-text tracking-tight">
                    Signing you in...
                </h1>
<p class="font-body-md text-body-md text-mute mt-xs px-xl">
                    Verifying your credentials and securing your session.
                </p>
</div>
</div>
<!-- Minimal Footer Ornament -->
<div class="absolute bottom-xl w-full flex justify-center opacity-40">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-mute">Enterprise Secure Link</span>
</div>
</div>
</main>
<!-- Micro-interaction for simulated completion -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Optional: Simulate a progress state or redirect logic
            console.log('Transition screen initialized...');
            
            // Interaction: Pulse the text slightly every 2 seconds
            const statusText = document.querySelector('.shimmer-text');
            setInterval(() => {
                statusText.classList.add('scale-[1.02]');
                setTimeout(() => {
                    statusText.classList.remove('scale-[1.02]');
                }, 1000);
            }, 2000);
        });
    </script>
</body></html>
