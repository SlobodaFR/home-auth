<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-pulse {
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0; }
        }
    </style>

<body class="bg-soft-cloud text-on-surface min-h-screen flex flex-col antialiased">
<!-- Transactional Screen: Navigation Shell Suppressed per "The Destination Rule" -->
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-xxl relative overflow-hidden">
<!-- Atmospheric Background Element -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none z-0">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] bg-secondary/5 rounded-full blur-[120px]"></div>
</div>
<!-- Success Container -->
<div class="relative z-10 w-full max-w-md">
<!-- Brand Anchor (Simplified for Transactional) -->
<div class="flex justify-center mb-xl">
<span class="font-headline-lg text-headline-lg font-black text-primary tracking-tighter">Auth Service</span>
</div>
<!-- Card -->
<div class="bg-canvas border border-hairline rounded-xl p-xl shadow-sm text-center">
<!-- Icon Assembly -->
<div class="relative inline-flex items-center justify-center mb-lg">
<div class="absolute inset-0 bg-secondary/10 rounded-full success-pulse"></div>
<div class="relative w-16 h-16 bg-secondary/10 text-secondary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined !text-[32px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Content Hierarchy -->
<h1 class="font-headline-xl text-headline-xl text-ink mb-md tracking-tight">Check your email</h1>
<p class="font-body-md text-body-md text-mute mb-xl leading-relaxed">
                    We've sent a sign-in link to <span class="text-ink font-body-strong">alex@example.com</span>. Please check your inbox and click the link to continue.
                </p>
<!-- Actions -->
<div class="space-y-gutter">
<button class="w-full bg-primary text-on-primary py-md px-lg rounded-lg font-button-md text-button-md hover:bg-primary-container transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="openEmailBtn">
                        Open email app
                    </button>
<div class="pt-sm border-t border-hairline">
<p class="font-caption text-caption text-mute">
                            Didn't receive it? 
                            <button class="text-primary font-body-strong hover:underline ml-xs transition-colors" id="resendBtn">
                                Resend link
                            </button>
</p>
</div>
</div>
</div>
<!-- Global Footer Link -->
<div class="mt-xl text-center">
<a class="font-label-sm text-label-sm text-mute hover:text-ink transition-colors inline-flex items-center gap-xs" href="#">
<span class="material-symbols-outlined !text-[16px]" data-icon="arrow_back">arrow_back</span>
                    Back to login
                </a>
</div>
</div>
</main>
<!-- Support/Legal Footer -->
<footer class="py-lg px-margin-desktop">
<div class="max-w-md mx-auto flex justify-between items-center opacity-40 hover:opacity-100 transition-opacity">
<span class="font-label-sm text-label-sm text-mute">© 2024 Auth Service</span>
<div class="flex gap-md">
<a class="font-label-sm text-label-sm text-mute hover:text-primary" href="#">Support</a>
<a class="font-label-sm text-label-sm text-mute hover:text-primary" href="#">Privacy</a>
</div>
</div>
</footer>
<script>
        // Micro-interactions
        const resendBtn = document.getElementById('resendBtn');
        const openEmailBtn = document.getElementById('openEmailBtn');

        resendBtn.addEventListener('click', function() {
            const originalText = this.innerHTML;
            this.disabled = true;
            this.innerHTML = 'Sending...';
            this.classList.add('opacity-50');
            
            setTimeout(() => {
                this.innerHTML = 'Sent!';
                this.classList.replace('text-primary', 'text-secondary');
                
                setTimeout(() => {
                    this.innerHTML = originalText;
                    this.classList.replace('text-secondary', 'text-primary');
                    this.disabled = false;
                    this.classList.remove('opacity-50');
                }, 3000);
            }, 1000);
        });

        openEmailBtn.addEventListener('click', function() {
            // Simulated interaction: In a real app, this might attempt to deep link to mail clients
            console.log('Attempting to open email client...');
            this.classList.add('scale-95');
            setTimeout(() => this.classList.remove('scale-95'), 150);
        });
    </script>
