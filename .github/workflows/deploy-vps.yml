name: Deploy to VPS

on:
  workflow_run:
    workflows: [Build & Publish]
    types: [completed]
    branches: [main]

# One deploy at a time on the VPS: queued, never cancelled mid-flight (convention harnais workflow-concurrency).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve image tag
        id: tag
        run: |
          echo "value=sha-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VPS_HOST: op://TECH/thomassloboda_home_secrets/VPS_HOST
          VPS_USER: op://TECH/thomassloboda_home_secrets/VPS_USER
          VPS_SSH_KEY: op://TECH/thomassloboda_home_secrets/VPS_PRIVATE_KEY
          ADMIN_EMAIL: op://TECH/thomassloboda_home_secrets/AUTH_ADMIN_EMAIL
          AUTH_BASE_URL: op://TECH/thomassloboda_home_secrets/AUTH_BASE_URL
          FRONTEND_URL: op://TECH/thomassloboda_home_secrets/AUTH_FRONTEND_URL
          RESEND_API_KEY: op://TECH/thomassloboda_home_secrets/AUTH_RESEND_API_KEY
          EMAIL_FROM: op://TECH/thomassloboda_home_secrets/AUTH_EMAIL_FROM
          PSEUDONYM_SECRET: op://TECH/thomassloboda_home_secrets/AUTH_PSEUDONYM_SECRET
          POSTHOG_API_KEY: op://TECH/thomassloboda_home_secrets/POSTHOG_API_KEY
          FEATURES_OFREP_URL: op://TECH/thomassloboda_home_secrets/FEATURES_OFREP_URL
          FEATURES_API_KEY: op://TECH/thomassloboda_home_secrets/AUTH_FEATURES_API_KEY
          MINIO_ENDPOINT: op://TECH/thomassloboda_home_secrets/MINIO_ENDPOINT
          MINIO_BUCKET: op://TECH/thomassloboda_home_secrets/MINIO_BUCKET
          MINIO_REPLICA_PATH: op://TECH/thomassloboda_home_secrets/AUTH_MINIO_REPLICA_PATH
          AVATARS_PREFIX: op://TECH/thomassloboda_home_secrets/AUTH_AVATARS_PREFIX
          MINIO_REGION: op://TECH/thomassloboda_home_secrets/MINIO_REGION
          MINIO_ACCESS_KEY_ID: op://TECH/thomassloboda_home_secrets/MINIO_ACCESS_KEY_ID
          MINIO_SECRET_ACCESS_KEY: op://TECH/thomassloboda_home_secrets/MINIO_SECRET_ACCESS_KEY
          GHCR_PAT: op://TECH/thomassloboda_home_secrets/GITHUB_PAT_FULL_ACCESS
          JWT_PRIVATE_KEY_PEM: op://TECH/thomassloboda_home_secrets/AUTH_JWT_PRIVATE_KEY
          JWT_PUBLIC_KEY_PEM: op://TECH/thomassloboda_home_secrets/AUTH_JWT_PUBLIC_KEY

      - name: Normalize VPS_SSH_KEY
        # The 1Password field stores only the base64 body (no BEGIN/END
        # markers, possibly with stray spaces from line-wrap collapsing).
        # Strip spaces (base64 never contains any) and wrap with markers.
        run: |
          {
            echo "VPS_SSH_KEY<<EOF_SSH_KEY"
            echo "-----BEGIN OPENSSH PRIVATE KEY-----"
            printf '%s' "$VPS_SSH_KEY" | tr -d ' '
            echo
            echo "-----END OPENSSH PRIVATE KEY-----"
            echo "EOF_SSH_KEY"
          } >> "$GITHUB_ENV"

          {
            printf '%s' "$VPS_SSH_KEY" | tr -d ' '
          } > /tmp/key_body
          {
            echo "-----BEGIN OPENSSH PRIVATE KEY-----"
            cat /tmp/key_body
            echo
            echo "-----END OPENSSH PRIVATE KEY-----"
          } > /tmp/key
          echo "::add-mask::$(cat /tmp/key_body)"
          rm -f /tmp/key_body /tmp/key

      - name: Encode JWT signing keys
        # The PEM is multi-line and a docker compose .env file takes no raw
        # newline: ship it as one base64 line, decoded by the app. Validated
        # here so a broken 1Password value fails before anything is deployed;
        # only the public key fingerprint (SHA-256 of the SPKI DER, the one the
        # app logs at startup) is printed.
        run: |
          set -euo pipefail
          pem() { printf '%s\n' "${1//\\n/$'\n'}"; }
          priv="$(pem "$JWT_PRIVATE_KEY_PEM")"
          pub="$(pem "$JWT_PUBLIC_KEY_PEM")"
          priv_b64="$(printf '%s\n' "$priv" | base64 | tr -d '\n')"
          pub_b64="$(printf '%s\n' "$pub" | base64 | tr -d '\n')"
          echo "::add-mask::$priv_b64"
          echo "::add-mask::$pub_b64"
          printf '%s\n' "$priv" | openssl pkey -noout >/dev/null 2>&1 \
            || { echo "::error::AUTH_JWT_PRIVATE_KEY is not a valid PEM private key"; exit 1; }
          printf '%s\n' "$pub" | openssl pkey -pubin -noout >/dev/null 2>&1 \
            || { echo "::error::AUTH_JWT_PUBLIC_KEY is not a valid PEM public key"; exit 1; }
          priv_fp="$(printf '%s\n' "$priv" | openssl pkey -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          pub_fp="$(printf '%s\n' "$pub" | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          [ "$priv_fp" = "$pub_fp" ] \
            || { echo "::error::AUTH_JWT_PRIVATE_KEY and AUTH_JWT_PUBLIC_KEY do not form a pair (public key sha256:$pub_fp, private key belongs to sha256:$priv_fp)"; exit 1; }
          echo "JWT public key fingerprint from 1Password: sha256:$pub_fp"
          {
            echo "JWT_PRIVATE_KEY_B64=$priv_b64"
            echo "JWT_PUBLIC_KEY_B64=$pub_b64"
          } >> "$GITHUB_ENV"

      - name: Check the 1Password key is the live key
        # A valid but wrong pair would pass every check above and then make the
        # new container refuse to start. Compare, on the runner and before
        # anything touches the VPS, the 1Password public key with the one the
        # live JWKS publishes (SHA-256 of the SPKI DER, fingerprints only in the
        # output). Unreachable JWKS fails too. First deploy or deliberate
        # rotation: set the repository variable JWT_KEY_ROTATION=1 (README).
        run: node deploy/scripts/check-live-jwks.mjs
        env:
          JWT_KEY_ROTATION: ${{ vars.JWT_KEY_ROTATION }}

      - name: Write remote .env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          envs: ADMIN_EMAIL,AUTH_BASE_URL,FRONTEND_URL,RESEND_API_KEY,EMAIL_FROM,PSEUDONYM_SECRET,POSTHOG_API_KEY,FEATURES_OFREP_URL,FEATURES_API_KEY,MINIO_ENDPOINT,MINIO_BUCKET,MINIO_REPLICA_PATH,AVATARS_PREFIX,MINIO_REGION,MINIO_ACCESS_KEY_ID,MINIO_SECRET_ACCESS_KEY,JWT_PRIVATE_KEY_B64,JWT_PUBLIC_KEY_B64
          script: |
            # Private key inside: created 0600 from the start (no readable
            # window, even if a looser file existed) and swapped in atomically.
            umask 077
            mkdir -p /opt/auth-service/deploy
            cat > /opt/auth-service/deploy/.env.new <<EOF
            NODE_ENV=production
            PORT=3000
            TRUST_PROXY_HOPS=1
            ADMIN_EMAIL=$ADMIN_EMAIL
            AUTH_BASE_URL=$AUTH_BASE_URL
            FRONTEND_URL=$FRONTEND_URL
            RESEND_API_KEY=$RESEND_API_KEY
            EMAIL_FROM=$EMAIL_FROM
            PSEUDONYM_SECRET=$PSEUDONYM_SECRET
            POSTHOG_API_KEY=$POSTHOG_API_KEY
            FEATURES_OFREP_URL=$FEATURES_OFREP_URL
            FEATURES_API_KEY=$FEATURES_API_KEY
            MINIO_ENDPOINT=$MINIO_ENDPOINT
            MINIO_BUCKET=$MINIO_BUCKET
            MINIO_REPLICA_PATH=$MINIO_REPLICA_PATH
            AVATARS_PREFIX=$AVATARS_PREFIX
            MINIO_REGION=$MINIO_REGION
            MINIO_ACCESS_KEY_ID=$MINIO_ACCESS_KEY_ID
            MINIO_SECRET_ACCESS_KEY=$MINIO_SECRET_ACCESS_KEY
            JWT_PRIVATE_KEY_B64=$JWT_PRIVATE_KEY_B64
            JWT_PUBLIC_KEY_B64=$JWT_PUBLIC_KEY_B64
            EOF
            mv -f /opt/auth-service/deploy/.env.new /opt/auth-service/deploy/.env

      - name: Sync deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: 'deploy/docker-compose.yml,deploy/scripts/update-vps.sh,deploy/scripts/compose-up-healthy.sh,deploy/scripts/pre-deploy-backup.sh,deploy/scripts/restore-sqlite-backup.sh,deploy/Caddyfile'
          target: /opt/auth-service
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          envs: IMAGE,IMAGE_TAG,DEPLOY_DIR,GHCR_PAT,GHCR_USER
          command_timeout: 30m
          script: |
            exec 9>/tmp/home-deploy.lock
            flock -w 900 9 || { echo "deploy lock timeout"; exit 1; }
            bash /opt/auth-service/deploy/scripts/pre-deploy-backup.sh \
              --service auth --project auth-service --volume auth-data \
              --mount /app/backend/data --db-path /app/backend/data/sso.sqlite --tag "$IMAGE_TAG" \
              || { echo "pre-deploy backup failed: deploy aborted"; exit 1; }
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            chmod +x /opt/auth-service/deploy/scripts/update-vps.sh
            sh /opt/auth-service/deploy/scripts/update-vps.sh
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          DEPLOY_DIR: /opt/auth-service
          GHCR_PAT: ${{ env.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
