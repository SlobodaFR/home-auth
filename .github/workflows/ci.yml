name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check frontend
        run: npx tsc -b --noEmit
        working-directory: frontend

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker-build-check:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: lint-and-test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lockfile guard (runtime packages must live in /app/node_modules)
        run: sh .github/scripts/lockfile-runtime-check.sh --service home-auth --dockerfile Dockerfile --workspace backend

      - name: Build Docker image (loaded, no push)
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          load: true
          push: false
          tags: home-auth:ci-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Non-root migration check (a root-owned data volume, once chowned to 1000, must boot with its data and keys)
        run: sh .github/scripts/nonroot-volume-migration-check.sh --image home-auth:ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Boot check (the container must start and stay healthy)
        run: |
          sh .github/scripts/docker-boot-check.sh --service home-auth --image home-auth:ci-${{ github.run_id }}-${{ github.run_attempt }} --rm-image \
            --volume /app/backend/data --path /healthz --expect /healthz=200 --expect /version=200 --expect /.well-known/jwks.json=200 --expect /me=401 --forbid-ts \
            --env AUTH_BASE_URL=https://auth.example.test --env FRONTEND_URL=https://app.example.test \
            --secret PSEUDONYM_SECRET
