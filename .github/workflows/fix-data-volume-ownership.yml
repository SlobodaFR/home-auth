name: Fix data volume ownership

# One-shot maintenance: since the runtime image runs as the non-root `node`
# user (uid 1000), the pre-existing `auth-data` volume (created by root) must
# be chowned once, then the container restarted.
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VPS_HOST: op://TECH/thomassloboda_home_secrets/VPS_HOST
          VPS_USER: op://TECH/thomassloboda_home_secrets/VPS_USER
          VPS_SSH_KEY: op://TECH/thomassloboda_home_secrets/VPS_PRIVATE_KEY

      - name: Normalize VPS_SSH_KEY
        run: |
          {
            echo "VPS_SSH_KEY<<EOF_SSH_KEY"
            echo "-----BEGIN OPENSSH PRIVATE KEY-----"
            printf '%s' "$VPS_SSH_KEY" | tr -d ' '
            echo
            echo "-----END OPENSSH PRIVATE KEY-----"
            echo "EOF_SSH_KEY"
          } >> "$GITHUB_ENV"

      - name: Chown volume and restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            VOLUME=$(docker volume ls -q --filter label=com.docker.compose.project=auth-service | grep 'auth-data$')
            CONTAINER=$(docker ps -a -q --filter label=com.docker.compose.project=auth-service --filter label=com.docker.compose.service=auth-service)
            echo "volume=$VOLUME container=$CONTAINER"
            docker run --rm -v "$VOLUME":/data alpine chown -R 1000:1000 /data
            docker restart "$CONTAINER"
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/.well-known/jwks.json || true)
              [ "$CODE" = "200" ] && echo "jwks OK" && exit 0
              sleep 2
            done
            echo "Service not healthy, status: $(docker inspect -f '{{.State.Status}} restarts={{.RestartCount}}' "$CONTAINER")"
            exit 1
